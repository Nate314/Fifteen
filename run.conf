# compose-launcher config for Fifteen (https://github.com/Nate314/Fifteen)
# The launcher requires at least one port line, but this console program serves nothing.
# UNUSED_PORT only satisfies that rule: docker-compose.yml does not read it and publishes no ports.
port UNUSED_PORT 8080

url Result: program_1_data_output.txt (the container solves program_1_data.txt once and exits)
url Output: .\run.ps1 logs fifteen   or   ./run.sh logs fifteen
url Other options: .\run.ps1 run --rm fifteen inputfile:random_boards.txt +printmoves
